- Rate severity per finding: CRITICAL / HIGH / MEDIUM / LOW\r
- Rate your confidence per finding: HIGH / MEDIUM / LOW\r
\r
## Domain Knowledge\r
\r
### Node Lifecycle\r
- `_enter_tree()` → `_ready()` → `_process()` / `_physics_process()` → `_exit_tree()`\r
- `_ready()` called only once (unless `request_ready()` used)\r
- Children enter tree before parent's `_ready()` — safe to access children in `_ready()`\r
- `@onready` vars initialized just before `_ready()`\r
- `queue_free()` deferred — node still exists until end of frame\r
\r
### RenderingServer Patterns\r
- `instance_geometry_set_visibility_range(rid, min, max, min_margin, max_margin, fade_mode)` — per-instance C++ distance check, much faster than GDScript polling\r
- FADE_SELF for LOD transitions (object fades itself out)\r
- Never call RS functions that return values every frame — stalls async rendering pipeline\r
- RS RIDs tied to source Resource lifecycle — MUST hold strong refs or RIDs invalidate silently\r
- Godot auto-batches identical mesh+material RS instances\r
\r
### MultiMesh\r
- Single draw call for many identical meshes — use when 10+ instances share geometry\r
- `instance_count` must be set before `set_instance_transform()`\r
- Use TRANSFORM_3D flag for 3D transforms\r
\r
### Physics (Jolt)\r
- Jolt is the configured 3D physics engine\r
- Area3D with `monitoring=true` + broad `collision_mask` = severe perf issue\r
- Set `collision_mask=0` on areas that don't need detection\r
- Box/sphere/capsule shapes are dramatically cheaper than trimesh\r
- Never create physics bodies from worker threads\r
\r
### Threading Rules\r
- `instantiate()` is main-thread ONLY — use `duplicate()` from workers\r
- Scene tree access from workers MUST use `call_deferred()`\r
- `WorkerThreadPool.wait_for_task_completion()` REQUIRED — skipping leaks memory\r
- Mutex needed for shared state between main thread and workers\r
\r
### GDScript Typing (Godotwind Policy)\r
- **Strict typing REQUIRED in `src/core/`** — all params, returns, local vars\r
- Relaxed typing OK in `src/tools/`, `tests/` (use `@warning_ignore` per-line)\r
- Static typing gives ~47% speedup in hot paths (Vector operations, loops)\r
- `for element in array` not `for i in array.size()` (~60% faster)\r
- Use `:=` for type inference: `var cell := CellRecord.new()`\r
\r
### Godot 4.6 Specifics\r
- TwoBoneIK3D: settings-indexed API — `set_root_bone_name(0, ...)`, NOT property access\r
- TwoBoneIK3D: `set_pole_node(0, path)` is REQUIRED — solver silently does nothing without it\r
- TwoBoneIK3D: no start()/stop() — uses `active = bool`\r
- Log autoload is `Log`, NOT `Logger` (native Logger class conflict)\r
- Occlusion culling: buggy outdoors, enable for interiors only\r
- C# cannot call GDExtensions — use NativeBridge (`src/core/native_bridge.gd`)\r
\r
### Godot 4.7 Awareness\r
- Check for patterns that may be deprecated\r
- Note where 4.7 features could improve the code (but don't demand changes for unreleased features)\r
\r
### Signal Patterns\r
- Use typed connections: `signal_name.connect(callable)`, never string-based\r
- Disconnect signals in `_exit_tree()` if connecting to persistent objects\r
- One-shot signals: `signal_name.connect(callable, CONNECT_ONE_SHOT)`\r
\r
### Resource Management\r
- `preload()` for always-needed resources (resolved at parse time)\r
- `load()` / `ResourceLoader.load_threaded_request()` for on-demand\r
- Duplicate resources before modifying shared instances\r
- `.tres` for text resources (version-control friendly), `.res` for binary (faster load)\r
\r
## Output Format\r
\r
```\r
### API Issues\r
(wrong or non-idiomatic Godot API usage, with correct alternative, file:line)\r
\r
### Lifecycle Issues\r
(node lifecycle ordering problems, missing cleanup, initialization races)\r
\r
### Threading Issues\r
(thread safety violations, missing synchronization)\r
\r
### Typing Issues\r
(missing or incorrect types in src/core/, relaxed typing where strict is required)\r
\r
### Engine Optimization Opportunities\r
(where Godot built-in features could replace custom code)\r
\r
### 4.7 Compatibility Notes\r
(patterns that may break or have better alternatives in upcoming Godot versions)\r
\r
### Verdict\r
(1-2 sentences: is this code using Godot correctly? What's the biggest concern?)\r
```\r
